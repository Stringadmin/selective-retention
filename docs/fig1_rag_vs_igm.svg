<svg viewBox="0 0 680 470" width="680" height="470" xmlns="http://www.w3.org/2000/svg" font-family="SimHei, Microsoft YaHei, sans-serif">
<title>标准 RAG 与 IGM 写入层架构对比</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="470" fill="#1a1a18"/>

<text x="40" y="52" font-size="14" font-weight="500" fill="#B5D4F4">标准 RAG：只管读，写入默认全存</text>

<rect x="40" y="70" width="120" height="56" rx="8" fill="#042C53" stroke="#85B7EB" stroke-width="0.5"/>
<text x="100" y="98" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#E6F1FB">对话历史</text>
<rect x="200" y="70" width="120" height="56" rx="8" fill="#501313" stroke="#F09595" stroke-width="0.5"/>
<text x="260" y="98" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#FCEBEB">全量写入</text>
<rect x="360" y="70" width="120" height="56" rx="8" fill="#042C53" stroke="#85B7EB" stroke-width="0.5"/>
<text x="420" y="98" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#E6F1FB">向量库</text>
<rect x="520" y="70" width="120" height="56" rx="8" fill="#042C53" stroke="#85B7EB" stroke-width="0.5"/>
<text x="580" y="98" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#E6F1FB">检索回答</text>
<line x1="160" y1="98" x2="192" y2="98" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="320" y1="98" x2="352" y2="98" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480" y1="98" x2="512" y2="98" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="140" width="440" height="34" rx="8" fill="none" stroke="#F09595" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="420" y="161" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#F09595">旧值新值平级共存，无"谁取代谁"→ 矛盾解决失败</text>

<line x1="340" y1="196" x2="340" y2="218" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 3"/>

<text x="40" y="242" font-size="14" font-weight="500" fill="#9FE1CB">RAG + IGM：补上缺失的写入层</text>

<rect x="40" y="260" width="100" height="56" rx="8" fill="#042C53" stroke="#85B7EB" stroke-width="0.5"/>
<text x="90" y="288" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#E6F1FB">对话历史</text>
<rect x="180" y="260" width="150" height="56" rx="8" fill="#04342C" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="255" y="278" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#E1F5EE">重要性闸门</text>
<text x="255" y="299" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9FE1CB">只写值得记的</text>
<rect x="370" y="260" width="150" height="56" rx="8" fill="#04342C" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="445" y="278" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#E1F5EE">slot 覆盖写入</text>
<text x="445" y="299" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9FE1CB">新值取代旧值</text>
<rect x="560" y="260" width="80" height="56" rx="8" fill="#042C53" stroke="#85B7EB" stroke-width="0.5"/>
<text x="600" y="288" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#E6F1FB">向量库</text>
<line x1="140" y1="288" x2="172" y2="288" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="330" y1="288" x2="362" y2="288" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="520" y1="288" x2="552" y2="288" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="180" y="330" width="340" height="34" rx="8" fill="none" stroke="#5DCAA5" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="350" y="351" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9FE1CB">写入层增强，向量库与检索不变</text>

<rect x="40" y="396" width="600" height="52" rx="12" fill="#1C1C1A" stroke="#444441" stroke-width="0.5"/>
<text x="60" y="418" font-size="13" font-weight="500" fill="#E8E6DF">核心主张：RAG 解决了"读"（检索），但没解决"写"（存什么、怎么更新）。</text>
<text x="60" y="438" font-size="12" fill="#B4B2A9">矛盾解决的钥匙在写入层 —— 别让旧值进库，而不是指望读的时候区分开。</text>
</svg>
